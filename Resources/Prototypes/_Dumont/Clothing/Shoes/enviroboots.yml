#region Base

- type: entity
  abstract: true
  parent: ClothingShoesBase
  id: ClothingShoesEnvirobootsBase
  components:
  - type: Armor
    modifiers:
      coefficients:
        Caustic: 0.95
  - type: TemperatureProtection
    heatingCoefficient: 0.5
    coolingCoefficient: 0.2
  - type: Clothing
    equipDelay: 0.4
    unequipDelay: 0.6 # Slightly higher delay to protect against accidental unequips
  - type: IgniteFromGasImmunity
    parts:
    - LeftFoot
    - RightFoot
  - type: Tag
    tags:
    - ClothMade
    - Recyclable
    - WhitelistChameleon
    - PlasmamanSafe
  - type: StainBlocker
    slots: [FEET]
  - type: GuideHelp
    guides: [ Plasmaman ]

- type: entity
  parent: ClothingShoesEnvirobootsBase
  id: ClothingShoesEnviroboots
  name: plasma enviroboots
  description: Covers up those scandalous boney feet.
