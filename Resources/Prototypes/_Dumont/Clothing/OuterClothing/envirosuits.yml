# region Base

- type: entity
  abstract: true
  parent: ClothingOuterBase
  id: ClothingOuterEnvirosuitBase
  name: base envirosuit
  components:
  - type: Armor
    modifiers:
      coefficients:
        Caustic: 0.90
    coverage:
    - Chest
    - Groin
    - Arm
    - Leg
    - Other
  - type: PressureProtection
    highPressureMultiplier: 0.75
  - type: TemperatureProtection
    heatingCoefficient: 0.5
    coolingCoefficient: 0.2
  - type: Clothing
    equipDelay: 0.4
    unequipDelay: 0.6
  - type: Item
    size: Ginormous
  - type: IgniteFromGasImmunity
    parts:
    - Chest
    - Groin
    - LeftArm
    - RightArm
    - LeftLeg
    - RightLeg
  - type: SelfExtinguisher
    cooldown: 100
    requiresIgniteFromGasImmune: true
    sound:
      path: /Audio/Effects/extinguish.ogg
  - type: LimitedCharges
    maxCharges: 4
  - type: AllowSuitStorage
    whitelist:
      tags:
      - GasTank
  - type: HideClothingLayerClothing # Goobstation
    hiddenSlots:
    - jumpsuit
  - type: GuideHelp
    guides: [ Plasmaman ]
  - type: StainBlocker
    slots: [OUTERCLOTHING, INNERCLOTHING]
  - type: Tag
    tags:
    - WhitelistChameleon
    - PlasmamanSafe

