#region Base

- type: entity
  abstract: true
  parent: ClothingHeadBase
  id: ClothingHeadEnvirohelmetBase
  components:
  - type: Sprite
    layers:
    - state: icon
    - state: icon-flash
      visible: false
      shader: unshaded
      map: [ "light" ]
  - type: Armor
    modifiers:
      coefficients:
        Caustic: 0.90
    coverage:
    - Head
  - type: EyeProtection
  - type: BreathMask
  - type: PressureProtection
    highPressureMultiplier: 0.75
  - type: TemperatureProtection
    heatingCoefficient: 0.5
    coolingCoefficient: 0.2
  - type: Item
    size: Normal
    heldPrefix: off
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: Clothing
    equipDelay: 0.4
    unequipDelay: 0.6
    equippedPrefix: off
    slots:
    - HEAD
    clothingVisuals:
      head:
      - state: equipped-HELMET
    equipSound:
      collection: GenericEquip
  - type: Appearance
  - type: IgniteFromGasImmunity
    parts:
    - Head
  - type: ToggleableVisuals
    spriteLayer: light
    clothingVisuals:
      head:
      - state: equipped-HELMET-light
        shader: unshaded
  - type: IngestionBlocker
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    clothingSlots:
    - mask
  - type: ItemTogglePointLight
  - type: PointLight
    enabled: false
    color: "#ba7fba"
    radius: 4
    energy: 3
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    netsync: false
  - type: GuideHelp
    guides: [ Plasmaman ]
  - type: StainBlocker
    slots: [MASK, HEAD]
  - type: HandheldLight
    addPrefix: false
  - type: Battery
    maxCharge: 600 #lights drain 3/s but recharge of 2 makes this 1/s. Therefore 600 is 10 minutes of light.
    startingCharge: 600
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 2 #recharge of 2 makes total drain 1w / s so max charge is 1:1 with time. Time to fully charge should be 5 minutes. Having recharge gives light an extended flicker period which gives you some warning to return to light area.
  - type: Tag
    tags:
    - WhitelistChameleon
    - PlasmamanSafe

- type: entity
  parent: BaseAction
  id: ActionToggleEnvirohelmet
  name: Toggle Envirohelmet
  description: Changes the Envirohelmet to a less or more protected version.
  components:
  - type: Action
    itemIconStyle: BigItem
  - type: InstantAction
    event: !type:ToggleEnvirohelmetEvent

- type: entity
  abstract: true
  parent: ClothingHeadEnvirohelmetBase
  id: ClothingHeadEnvirohelmetToggleableBase
  components:
  - type: Sprite
    layers:
      - state: icon
        map: [ "closed" ]
      - state: open-icon
        visible: false
        map: [ "open" ]
      - state: icon-flash
        visible: false
        shader: unshaded
        map: [ "light" ]
      - state: open-icon-flash
        visible: false
        shader: unshaded
        map: [ "open-light" ]
  - type: PressureProtection
    highPressureMultiplier: 0.5
    lowPressureMultiplier: 1000
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.2
      OrganDamage: 0.2
      BoneDamage: 0.2
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.75
        Slash: 0.75
        Piercing: 0.8
        Heat: 0.75
        Radiation: 0.75
        Caustic: 0.80
  - type: EnvirohelmetToggle
    isActive: false
    components:
      - type: PressureProtection
        highPressureMultiplier: 1
        lowPressureMultiplier: 1
      - type: Armor
        traumaDeductions:
          Dismemberment: 0.2
          OrganDamage: 0.2
          BoneDamage: 0.2
          VeinsDamage: 0
          NerveDamage: 0
        modifiers:
          coefficients:
            Blunt: 0.90
            Slash: 0.90
            Piercing: 0.90
            Heat: 0.90
            Radiation: 0.95
            Caustic: 0.90
    closedComponents:
      - type: PressureProtection
        highPressureMultiplier: 0.5
        lowPressureMultiplier: 1000
      - type: Armor
        coverage:
        - Head
        traumaDeductions:
          Dismemberment: 0.2
          OrganDamage: 0.2
          BoneDamage: 0.2
          VeinsDamage: 0
          NerveDamage: 0
        modifiers:
          coefficients:
            Blunt: 0.75
            Slash: 0.75
            Piercing: 0.8
            Heat: 0.75
            Radiation: 0.75
            Caustic: 0.80
  - type: EnvirohelmetVisuals
    spriteLayer: open
    clothingVisuals:
      head:
      - state: open-equipped-HELMET
      - state: open-equipped-HELMET-light
        shader: unshaded
    inhandVisuals:
      left:
      - state: open-inhand-left
      right:
      - state: open-inhand-right

- type: entity
  parent: ClothingHeadEnvirohelmetBase
  id: ClothingHeadEnvirohelmet
  name: plasma envirohelmet
  description: A special containment helmet that allows plasma-based lifeforms to exist safely in an oxygenated environment.
