# Control unit
- type: entity
  parent: BaseItem
  id: ModsuitModuleBasicStorage
  name: modsuit basic storage module
  description: A module that can be inserted inside modsuit control units to give them a decent amount of internal storage.
  components:
  - type: Sprite
    sprite: _Gabystation/Objects/Specific/modsuit_modules.rsi
    state: storage-control
  - type: ItemUpgrade
    name: modsuit-module-basic-storage-name
  - type: GunUpgradeComponents
    components:
    - type: Storage
      grid:
      - 0,0,1,3
      - 3,0,6,3
      - 8,0,9,3
      maxItemSize: Huge
  - type: Tag
    tags:
    - ModsuitControlUnitUpgrade
  - type: Item
    size: Ginormous

- type: entity
  parent: BaseItem
  id: ModsuitModuleLargeStorage
  name: modsuit large storage module
  description: A module that can be inserted inside modsuit control units to give them a large amount of internal storage.
