- type: entity
  parent: BaseItem
  id: ModsuitModuleSyndicateStorage
  name: modsuit syndicate storage module
  description: A module that can be inserted inside modsuit control units to allow the user to compress items inside the control unit, allowing for much more efficient storage than even bluespace storage.
  components:
