  - type: ItemUpgrade
    name: modsuit-module-large-storage-name
  - type: GunUpgradeComponents
    components:
    - type: Storage
      grid:
      - 0,0,7,4
      maxItemSize: Huge
  - type: Tag
    tags:
    - ModsuitControlUnitUpgrade
  - type: Item
    size: Ginormous

- type: entity
  parent: BaseItem
