    name: modsuit-module-large-storage-name #Para não ver o nome ao inspecionar a control unit com isso inserido.
  - type: GunUpgradeComponents
    components:
    - type: Storage
      grid:
      - 0,0,18,7 #Goob
      maxItemSize: Huge
  - type: Tag
    tags:
    - ModsuitControlUnitUpgrade
  - type: Item
    size: Ginormous
  - type: Contraband
    severity: Syndicate
    criminalPoints: 4.9
  - type: ScannableForPoints # Goobstation - NTR update
    points: 5
