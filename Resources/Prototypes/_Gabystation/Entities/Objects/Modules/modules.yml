## Chest
- type: entity
  parent: BaseItem
  id: ModsuitModuleAntiGrav
  name: modsuit anti-gravity module
  description: A module that can be inserted inside the chest of a modsuit to negate gravity for the user.
  components:
  - type: Item
    size: Ginormous
  - type: Sprite
    sprite: _Gabystation/Objects/Specific/modsuit_modules.rsi
    state: antigrav-chest
  - type: ItemUpgrade
    name: modsuit-module-antigrav-name
  - type: GunUpgradeComponents
    components:
    - type: AntiGravityClothing
  - type: Tag
    tags:
    - ModsuitChestUpgrade

- type: entity
  parent: BaseItem
  id: ModsuitModuleGPS
  name: modsuit GPS module
  description: A module that can be inserted inside the chest of a modsuit to grant it GPS functionality.
  components:
  - type: Item
    size: Ginormous
  - type: Sprite
    sprite: _Gabystation/Objects/Specific/modsuit_modules.rsi
    state: gps-chest
  - type: ItemUpgrade
    name: modsuit-module-gps-name
  - type: GunUpgradeComponents
    components:
    - type: GPS
    - type: ActivatableUI
      key: enum.GpsUiKey.Key
      inHandsOnly: false
      singleUser: false
    - type: UserInterface
      interfaces:
        enum.GpsUiKey.Key:
          type: GpsBoundUserInterface
  - type: Tag
    tags:
    - ModsuitChestUpgrade



- type: entity
  parent: BaseItem
  id: ModsuitModuleInjector
  name: modsuit injector module
  description: A module that can be inserted inside the chest of a modsuit to make it inject a small dose of healing and stimulating chemicals into the user when the user reaches critical condition.
  components:
  - type: Item
    size: Ginormous
  - type: Sprite
    sprite: _Gabystation/Objects/Specific/modsuit_modules.rsi
    state: injector-chest
  - type: ItemUpgrade
    name: modsuit-module-injector-name
  - type: GunUpgradeComponents
    components:
    - type: ClothingAutoInject
      reagents:
        Epinephrine: 10
        Bicaridine: 10
        TranexamicAcid: 5
        Tramadol: 5
  - type: Tag
    tags:
    - ModsuitChestUpgrade

