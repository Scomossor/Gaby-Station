  - type: CultItem

# WhiteDream - summoned boots. The chapel's ClothingShoesCult is left untouched.
- type: entity
  parent: ClothingShoesCult
  id: ClothingShoesCultSummoned
  name: zealot's boots
  description: Boots of the same dark weave. Sure-footed, whatever the floor is covered in.
  components:
  - type: Sprite
    sprite: WhiteDream/BloodCult/Clothing/cult_boots.rsi
