    icon: { sprite: WhiteDream/BloodCult/actions.rsi, state: create_emp }
    itemIconStyle: BigAction
    temporary: true
  - type: InstantAction
    event: !type:BloodCultEmpEvent
      speech: "Ta'gh fara'qha fel d'amar det!"
  - type: LimitedCharges
    maxCharges: 1
  - type: SpeakOnAction
    sentence: cult-spell-chant-emp
  - type: BaseCultSpell

- type: entity
  parent: BaseAction
  id: ActionBloodCultShadowShackles
  name: Shadow Shackles
  description: Empowers your hand to handcuff a victim on contact, and mute them if successful.
  categories: [ HideSpawnMenu ]
