- type: entity
  parent: BaseAction
  id: ActionBloodCultSelectSpells
  name: Prepare blood spells
  description: Opens the menu to prepare blood spells.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon: { sprite: WhiteDream/BloodCult/actions.rsi, state: blood_spells }
    itemIconStyle: NoItem
  - type: InstantAction
    event: !type:BloodCultSelectSpellsEvent {}

- type: entity
  parent: BaseAction
  id: ActionBloodCultCommune
  name: Commune
  description: Send a message to your fellow cultists, wherever they are. Beware - the uninitiated can see you whispering the incantation.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon: { sprite: WhiteDream/BloodCult/commune.rsi, state: commune }
    itemIconStyle: NoItem
    checkCanInteract: false
  - type: InstantAction
    event: !type:BloodCultCommuneEvent {}

- type: entity
  parent: BaseAction
  id: ActionBloodCultStudyVeil
  name: Study the veil
  description: Read the veil and learn how far the cult has come, and where reality is thin enough to tear.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon: { sprite: WhiteDream/BloodCult/actions.rsi, state: veiling }
    itemIconStyle: NoItem
    checkCanInteract: false
    useDelay: 5
  - type: InstantAction
    event: !type:BloodCultStudyVeilEvent {}

- type: entity
  parent: BaseAction
  id: ActionBloodCultRemoveSpells
  name: Remove blood spells
  description: Opens the menu to remove prepared blood spells.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon: { sprite: WhiteDream/BloodCult/actions.rsi, state: gone }
    itemIconStyle: NoItem
  - type: InstantAction
    event: !type:BloodCultRemoveSpellsEvent {}

- type: entity
  parent: BaseAction
  id: ActionBloodCultStun
  name: Stun
  description: Empowers your hand to stun and mute a victim on contact.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon: { sprite: WhiteDream/BloodCult/actions.rsi, state: stun }
    itemIconStyle: BigAction
    temporary: true
  - type: TargetAction
    checkCanAccess: false
    range: 3
    interactOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - Body
    event: !type:BloodCultStunEvent
      speech: "Fuu ma'jin!"
  - type: LimitedCharges
    maxCharges: 1
  - type: SpeakOnAction
    sentence: cult-spell-chant-stun
  # Dumont
  - type: BaseCultSpell
    bypassProtection: true

- type: entity
  parent: BaseAction
  id: ActionBloodCultTeleport
  name: Teleport
  description: Empowers your hand to teleport yourself or another cultist to a teleport rune on contact.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon: { sprite: WhiteDream/BloodCult/actions.rsi, state: teleport }
    itemIconStyle: BigAction
    temporary: true
  - type: TargetAction
    checkCanAccess: false
    range: 3
    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - BloodCultist
    event: !type:BloodCultTeleportEvent
      speech: "Sas'so c'arta forbici"
  - type: LimitedCharges
    maxCharges: 1
  - type: SpeakOnAction
    sentence: cult-spell-chant-teleport
  - type: BaseCultSpell

- type: entity
  parent: BaseAction
  id: ActionBloodCultEmp
  name: Electromagnetic Pulse
  description: Emits a large electromagnetic pulse.
  categories: [ HideSpawnMenu ]
