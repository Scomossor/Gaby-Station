  - type: Action
    icon: { sprite: WhiteDream/BloodCult/actions.rsi, state: shackles }
    itemIconStyle: BigAction
    temporary: true
  - type: TargetAction
    checkCanAccess: false
    range: 3
    interactOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - Body
    event: !type:BloodCultShacklesEvent
      speech: "In'totum Lig'abis!"
  - type: LimitedCharges
    maxCharges: 4
  - type: SpeakOnAction
    sentence: cult-spell-chant-shadow-shackles
  - type: BaseCultSpell

- type: entity
  parent: BaseAction
  id: ActionBloodCultTwistedConstruction
  name: Twisted Construction
  # Dumont
  description: Empowers your hand to turn a stack of plasteel into runed metal on contact.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon: { sprite: WhiteDream/BloodCult/actions.rsi, state: transmute }
    itemIconStyle: BigAction
    temporary: true
  - type: TargetAction
    checkCanAccess: false
    range: 3
    interactOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      tags:
      - TwistedConstructionTarget
    event: !type:BloodCultTwistedConstructionEvent
      speech: "Ethra p'ni dedol!"
  - type: LimitedCharges
    maxCharges: 1
  - type: SpeakOnAction
    sentence: cult-spell-chant-twisted-construction
  - type: BaseCultSpell

- type: entity
  parent: BaseAction
  id: ActionBloodCultSummonCombatEquipment
  name: Summon Combat Equipment
  description: Allows you to summon combat cult gear, including cult armor, a cult bola and a cult sword.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon: { sprite: WhiteDream/BloodCult/actions.rsi, state: summon_combat_equipment }
    itemIconStyle: BigAction
    temporary: true
  - type: InstantAction
    event: !type:SummonEquipmentEvent
      speech: "Wur d'dai leev'mai k'sagan!"
      prototypes:
        outerClothing: ClothingOuterArmorCultSummoned
        head: ClothingHeadHelmetCultSummoned
        shoes: ClothingShoesCultSummoned
        hand1: EldritchBlade
        hand2: CultBola
  - type: LimitedCharges
    maxCharges: 1
  - type: SpeakOnAction
    sentence: cult-spell-chant-summon-equipment
  - type: BaseCultSpell

- type: entity
  parent: BaseAction
  id: ActionBloodCultSummonRitualDagger
  name: Summon Ritual Dagger
