- type: species
  id: Plasmaman
  name: species-name-plasmaman
  roundStart: true
  prototype: MobPlasmaman
  sprites: MobPlasmamanSprites
  defaultSkinTone: "#ffffff"
  markingLimits: MobPlasmamanMarkingLimits
  dollPrototype: MobPlasmamanDummy
  skinColoration: NoColor # Dumont change
  youngAge: 60
  oldAge: 120
  maxAge: 180
  maleFirstNames: NamesPlasmaman
  femaleFirstNames: NamesPlasmaman
  naming: FirstRoman
  sexes:
  - Unsexed

- type: speciesBaseSprites
  id: MobPlasmamanSprites
  sprites:
    Head: MobPlasmamanHead
    HeadTop: MobHumanoidAnyMarking # Dumont change
    Face: MobHumanoidAnyMarking
    Underwear: MobHumanoidAnyMarking # Gaby change
    Undershirt: MobHumanoidAnyMarking # Gaby change
    Chest: MobPlasmamanChest
    #Eyes: MobPlasmamanEyes # Dumont change
    LArm: MobPlasmamanLArm
    RArm: MobPlasmamanRArm
    LHand: MobPlasmamanLHand
    RHand: MobPlasmamanRHand
    LLeg: MobPlasmamanLLeg
    RLeg: MobPlasmamanRLeg
    Groin: MobPlasmamanGroin
    LFoot: MobPlasmamanLFoot
    RFoot: MobPlasmamanRFoot

- type: markingPoints
  id: MobPlasmamanMarkingLimits
  onlyWhitelisted: true # Hides the hair and facial hair options
  points:
    Head:
      points: 4
      required: false
    Hair:
      points: 0
      required: false
    FacialHair:
      points: 0
      required: false
    Snout:
      points: 0
      required: false
    Tail:
      points: 0
      required: false
    HeadTop:
      points: 1
      required: false
    Chest:
      points: 1
      required: false
    Legs:
      points: 2
      required: false
    Arms:
      points: 2
      required: false
    # Begin DeltaV changes.
    Underwear:
      points: 1
      required: false
    Undershirt:
      points: 1
      required: false
    # End DeltaV changes

