- type: polymorph
  id: TongueSpike
  configuration:
    entity: TongueSpike
    forced: true
    makeSentient: false
    polymorphPopup: null
    exitPolymorphPopup: MutationTongueSpike-popup-revert

- type: polymorph
  id: TongueSpikeChem
  configuration:
    entity: TongueSpikeChem
    forced: true
    makeSentient: false
    polymorphPopup: null
    exitPolymorphPopup: MutationTongueSpike-popup-revert

- type: polymorph
  id: VoidMagnet
  configuration:
    entity: VoidMagnetPocket
    transferName: false
    inventory: None
    forced: true # have to wait it out chud
    revertOnDeath: true
    allowRepeatedMorphs: false
    polymorphSound: /Audio/Magic/ethereal_enter.ogg
    exitPolymorphSound: /Audio/Magic/ethereal_exit.ogg
    duration: 10
    effectProto: EffectDesynchronizer # TODO: make a more evil one
