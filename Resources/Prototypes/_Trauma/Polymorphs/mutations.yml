- type: polymorph
  id: MutationMonkey
  configuration:
    entity: MobMonkey
    transferName: true
    stripNameModifier: false # keep it when going monkey -> human -> monkey
    componentsToTransfer: [] # no language chud
    forced: true
    revertOnCrit: false
    revertOnDeath: false
    inventory: Transfer
    polymorphSound: /Audio/Animals/monkey_scream.ogg

- type: polymorph
  id: MutationHuman
  configuration:
    entity: MobHumanRandom
    transferName: false
    stripNameModifier: false
    # yes language so monkey is still forced to speak monkey
    forced: true
    revertOnCrit: false
    revertOnDeath: false
    inventory: Transfer
    polymorphSound: /Audio/Voice/Human/malescream_1.ogg

