
# Buncha stuff for LaserSec rework. The reason it's in trauma is because the ideas are from there.
- type: entity
  id: BulletGammaRayCannon
  name: Gamma ray bolt
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        hard: false
        mask:
        - Opaque
  - type: Reflective
    reflective:
    - Energy
  - type: FlyBySound
    sound:
      collection: EnergyMiss
      params:
        volume: 5
  - type: Sprite
    sprite: _Impstation/Objects/Weapons/Guns/Projectiles/energybolts.rsi
    layers:
    - state: mediumgold
      shader: unshaded
  - type: Projectile
    penetrationThreshold: 100
    impactEffect: BulletImpactEffectOrangeDisabler
    damage:
      types:
        Heat: 18




- type: entity
  id: BaseMagFedLaserBolt
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        hard: false
        mask:
        - Opaque
  - type: Reflective
    reflective:
    - Energy
  - type: FlyBySound
    sound:
      collection: EnergyMiss
      params:
        volume: 5
  - type: Ammo
    muzzleFlash: MuzzleFlashEffectHeavyLaser

