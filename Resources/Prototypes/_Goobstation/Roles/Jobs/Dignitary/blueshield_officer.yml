- type: job
  id: BlueshieldOfficer
  name: job-name-bs
  description: "Act as a bodyguard and advisor for Command and CentCom VIPs."
  playTimeTracker: JobBlueshieldOfficer
  requirements: # Dumont edit
    - !type:DepartmentTimeRequirement
      department: Command # How they work
      time: 180000 # 50 hrs
    - !type:RoleTimeRequirement
      role: JobParamedic # How to save them
      time: 43200 #12 hrs
    - !type:RoleTimeRequirement
      role: JobBrigmedic # How to save yourself
      time: 43200 #12 hrs
    - !type:DepartmentTimeRequirement
      department: Medical # How to not screw up treatment
      time: 180000 # 50 hrs
    - !type:DepartmentTimeRequirement
      department: Security # How to protect them
      time: 360000 # 100 hours
    # Good thing to have for MRP, but to be discussed at a later date
    # because there's no sense on enforcing this requirement on only 2 jobs
    #- !type:AgeRequirement
    #  requiredAge: 21
  guides:
  # - BlueshieldOfficerSOP
  - Command
  # - Succession
  goobcoins: 45
  salary: 75 # Gaby content
  weight: 20
  startingGear: BlueshieldOfficerGear
  icon: "JobIconBlueshield"
  joinNotifyCrew: true
  supervisors: job-supervisors-ntr-centcom
  canBeAntag: false
  access:
  - Security
  - Brig
  - External
  - Cryogenics
  - Maintenance
  - Engineering
  - Medical
  - Research
  - Command
  - CentralCommand
  - BlueshieldOfficer
  - Service
  - Hydroponics
  - Cargo
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant, BluespaceLifelineImplant ] # Go big, or go home.
  - !type:AddComponentSpecial
    components:
      - type: CommandStaff
      - type: Condemned
        soulOwnedNotDevil: true
  alternateTitles:
  - BlueshieldTitleSentinel
  - BlueshieldTitleGuard
  - BlueshieldTitleSecurity

- type: startingGear
  id: BlueshieldOfficerGear
  equipment:
    eyes: ClothingEyesGlassesBSO
    #gloves: ClothingHandsGlovesCombat - Goobstation, moved to loadouts
    id: BlueshieldPDA
    ears: ClothingHeadsetAltBlueshield
    belt: ClothingBeltAssaultFilled
    pocket1: UniqueBlueshieldOfficerLockerTeleporter
  storage:
    back:
    - Flash
    - ClothingBSOMaskGasSwat
    - CombatKnife

- type: chameleonOutfit
  id: BlueshieldOfficerChameleonOutfit
  job: BlueshieldOfficer
  equipment:
    head: ClothingHeadHatBeretEliteNavyOfficer
    eyes: ClothingEyesGlassesBSO
    mask: ClothingMaskGasSecurity
    ears: ClothingHeadsetAltBlueshield
    outerClothing: ClothingBlueshieldArmourVest
    neck: ClothingNeckMantleBlueshield
    gloves: ClothingHandsGlovesCombat
    jumpsuit: ClothingUniformJumpsuitBlueshieldOfficer
    id: BlueshieldPDA
    back: ClothingBackpackBlueshield
    shoes: ClothingShoesBootsJack

- type: jobAlternateTitle
  id: BlueshieldTitleSentinel
  name: job-name-alt-blueshield-sentinel

- type: jobAlternateTitle
  id: BlueshieldTitleGuard
  name: job-name-alt-blueshield-guard

- type: jobAlternateTitle
  id: BlueshieldTitleSecurity
  name: job-name-alt-blueshield-security
